name: S805-onecloud
on:
  workflow_dispatch:
    inputs:
      system:
        description: '选择系统'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      source_branch:
        description: '选择源码分支'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - openwrt-24.10
      kernel_ver:
        description: '选择内核（全部支持Docker）'
        required: true
        default: '6.12'
        type: choice
        options:
          - 6.6
          - 6.12
          - 6.18

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: 安装编译依赖
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libncurses-dev gawk git libssl-dev gettext xsltproc zlib1g-dev unzip python3 python3-pip libelf-dev flex bison

    - name: 下载指定分支源码
      run: |
        if [ "${{ inputs.system }}" = "immortalwrt" ]; then
          git clone --depth=1 -b ${{ inputs.source_branch }} https://github.com/immortalwrt/immortalwrt openwrt
        else
          git clone --depth=1 -b ${{ inputs.source_branch }} https://github.com/openwrt/openwrt openwrt
        fi

    - name: 设置内核版本 + 自动开启Docker内核模块
      run: |
        cd openwrt
        # 替换内核版本
        sed -i "s/^KERNEL_PATCHVER.*/KERNEL_PATCHVER=${{ inputs.kernel_ver }}/" target/linux/armvirt/Makefile
        
        # 给当前内核开启Docker必需模块（关键！所有版本通用）
        cat >> target/linux/armvirt/config-${{ inputs.kernel_ver }} << EOF
CONFIG_CGROUPS=y
CONFIG_NAMESPACES=y
CONFIG_VETH=y
CONFIG_BRIDGE=y
CONFIG_OVERLAY_FS=y
CONFIG_KEYS=y
CONFIG_SECURITY=y
CONFIG_SECCOMP=y
CONFIG_MEMCG=y
CONFIG_IPC_NS=y
CONFIG_UTS_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_SCHED=y
EOF

        # 更新软件源
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 导入S805 32位完整配置（Docker+中文+Argon）
      run: |
        cd openwrt
        # 核心编译配置
        cat > .config << EOF
CONFIG_TARGET_armvirt=y
CONFIG_TARGET_armvirt_32=y
CONFIG_TARGET_armvirt_32_Default=y
CONFIG_ROOTSFS_PARTSIZE=1536
# Docker 完整支持
CONFIG_PACKAGE_docker=y
CONFIG_PACKAGE_luci-app-dockerman=y
CONFIG_PACKAGE_containerd=y
CONFIG_PACKAGE_dockerd=y
# 常用插件
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_e2fsprogs=y
EOF

        # 固定IP配置
        mkdir -p files/etc/config
        cat > files/etc/config/network << EOF
config interface 'loopback'
        option device 'lo'
        option proto 'static'
        option ipaddr '127.0.0.1'
        option netmask '255.0.0.0'

config globals 'globals'
        option ula_prefix 'fd51:42f8:caae:9223::/64'

config interface 'lan'
        option device 'br-lan'
        option proto 'static'
        option ipaddr '192.168.2.2'
        option netmask '255.255.255.0'
        option gateway '192.168.2.1'
        option dns '223.5.5.5 114.114.114.114'

config device
        option name 'br-lan'
        option type 'bridge'
        list ports 'eth0'
EOF

        # 中文 + 默认Argon主题
        cat > files/etc/config/luci << EOF
config core 'main'
        option lang 'zh_cn'
        option mediaurlbase '/luci-static/argon'
        option resourcebase '/luci-static/resources'
EOF

    - name: 生成配置
      run: |
        cd openwrt
        make defconfig

    - name: 开始编译（单线程更稳定）
      run: |
        cd openwrt
        make -j1 V=s

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-s805-${{ inputs.source_branch }}-k${{ inputs.kernel_ver }}-docker
        path: openwrt/bin/targets/armvirt/32/*.img.gz
