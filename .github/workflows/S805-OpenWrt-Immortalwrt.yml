name: S805一键编译
on:
  workflow_dispatch:
    inputs:
      system:
        description: "选择要编译的系统"
        required: true
        default: immortalwrt
        type: choice
        options:
          - openwrt
          - immortalwrt
      branch:
        description: "选择源码分支"
        required: true
        default: openwrt-24.10
        type: choice
        options:
          - openwrt-24.10
          - openwrt-25.10
      kernel:
        description: "选择内核版本（全部支持Docker）"
        required: true
        default: "6.12"
        type: choice
        options:
          - "6.6"
          - "6.12"
          - "6.18"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 安装编译所需的系统依赖包
      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libncurses-dev gawk git libssl-dev gettext xsltproc zlib1g-dev unzip python3 python3-pip libelf-dev flex bison

      # 根据用户选择的系统和分支，使用 --depth=1 浅克隆加快速度
      - name: 下载源码
        run: |
          if [ "${{ inputs.system }}" = "immortalwrt" ]; then
            git clone --depth=1 -b ${{ inputs.branch }} https://github.com/immortalwrt/immortalwrt openwrt
          else
            git clone --depth=1 -b ${{ inputs.branch }} https://github.com/openwrt/openwrt openwrt
          fi

      # 修改内核版本并写入 Docker 所需的 Linux 内核选项
      # 注意：这里假定目标平台为 amlogic/meson8b，实际路径可能因源码版本而异，但语法已修正
      - name: 配置内核与Docker支持
        run: |
          cd openwrt
          # 修改内核版本（尝试常见的 Makefile 路径）
          if [ -f target/linux/amlogic/Makefile ]; then
            sed -i "s/^KERNEL_PATCHVER.*/KERNEL_PATCHVER=${{ inputs.kernel }}/" target/linux/amlogic/Makefile
          elif [ -f target/linux/meson8b/Makefile ]; then
            sed -i "s/^KERNEL_PATCHVER.*/KERNEL_PATCHVER=${{ inputs.kernel }}/" target/linux/meson8b/Makefile
          else
            echo "警告：未找到内核版本配置文件，请检查源码结构"
          fi
          # 创建内核 fragment 配置，启用 Docker 所需选项（避免 heredoc）
          printf '%s\n' \
            'CONFIG_CGROUPS=y' \
            'CONFIG_NAMESPACES=y' \
            'CONFIG_VETH=y' \
            'CONFIG_BRIDGE=y' \
            'CONFIG_OVERLAY_FS=y' \
            'CONFIG_KEYS=y' \
            'CONFIG_SECURITY=y' \
            'CONFIG_SECCOMP=y' \
            'CONFIG_MEMCG=y' \
            'CONFIG_IPC_NS=y' \
            'CONFIG_UTS_NS=y' \
            'CONFIG_PID_NS=y' \
            'CONFIG_NET_NS=y' \
            > target/linux/amlogic/config-${{ inputs.kernel }} 2>/dev/null || \
            > target/linux/meson8b/config-${{ inputs.kernel }} 2>/dev/null || true
          # 更新 feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      # 写入 S805 设备的固件配置 (.config) 以及预置的网络/Luci 文件
      - name: 导入S805固件配置
        run: |
          cd openwrt
          # 核心编译配置（使用 printf 替代 heredoc，避免缩进红线）
          printf '%s\n' \
            'CONFIG_TARGET_amlogic=y' \
            'CONFIG_TARGET_amlogic_meson8b=y' \
            'CONFIG_TARGET_amlogic_meson8b_DEVICE_onecloud=y' \
            'CONFIG_ROOTSFS_PARTSIZE=1536' \
            'CONFIG_PACKAGE_docker=y' \
            'CONFIG_PACKAGE_luci-app-dockerman=y' \
            'CONFIG_PACKAGE_containerd=y' \
            'CONFIG_PACKAGE_dockerd=y' \
            'CONFIG_PACKAGE_luci-app-ttyd=y' \
            'CONFIG_PACKAGE_luci-theme-argon=y' \
            'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' \
            > .config
          # 创建预置网络配置文件目录
          mkdir -p files/etc/config
          # 写入 network 配置
          printf '%s\n' \
            'config interface "loopback"' \
            '    option device "lo"' \
            '    option proto "static"' \
            '    option ipaddr "127.0.0.1"' \
            'config interface "lan"' \
            '    option device "eth0"' \
            '    option proto "static"' \
            '    option ipaddr "192.168.2.2"' \
            '    option netmask "255.255.255.0"' \
            '    option gateway "192.168.2.1"' \
            '    option dns "223.5.5.5 114.114.114.114"' \
            > files/etc/config/network
          # 写入 Luci 配置
          printf '%s\n' \
            'config core "main"' \
            '    option lang "zh_cn"' \
            '    option mediaurlbase "/luci-static/argon"' \
            > files/etc/config/luci

      # 根据 .config 生成完整的编译配置
      - name: 生成编译配置
        run: |
          cd openwrt
          make defconfig

      # 开始编译（使用单线程 V=s 输出详细日志，便于排查问题）
      - name: 开始编译固件
        run: |
          cd openwrt
          make -j1 V=s

      # 上传最终生成的固件（.img.gz 文件）
      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-s805-k${{ inputs.kernel }}-docker
          path: openwrt/bin/targets/amlogic/meson8b/*.img.gz
