name: S805一键编译
on:
  workflow_dispatch:
    inputs:
      system:
        description: "选择要编译的系统"
        required: true
        default: immortalwrt
        type: choice
        options:
          - openwrt
          - immortalwrt
      branch:
        description: "选择源码分支"
        required: true
        default: openwrt-24.10
        type: choice
        options:
          - openwrt-24.10
          - openwrt-25.10
      kernel:
        description: "选择内核版本（全部支持Docker）"
        required: true
        default: "6.12"
        type: choice
        options:
          - "6.6"
          - "6.12"
          - "6.18"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装编译依赖
        run: |
          sudo apt update -y
          sudo apt install -y build-essential libncurses-dev gawk git libssl-dev gettext xsltproc zlib1g-dev unzip python3 python3-pip libelf-dev flex bison

      - name: 下载源码
        run: |
          if [ "${{ inputs.system }}" = "immortalwrt" ]; then
            git clone --depth=1 -b ${{ inputs.branch }} https://github.com/immortalwrt/immortalwrt openwrt
          else
            git clone --depth=1 -b ${{ inputs.branch }} https://github.com/openwrt/openwrt openwrt
          fi

      - name: 配置内核与Docker支持
        run: |
          cd openwrt
          sed -i "s/^KERNEL_PATCHVER.*/KERNEL_PATCHVER=${{ inputs.kernel }}/" target/linux/armvirt/Makefile
          cat > target/linux/armvirt/config-${{ inputs.kernel }} <<-'EOF'
          CONFIG_CGROUPS=y
          CONFIG_NAMESPACES=y
          CONFIG_VETH=y
          CONFIG_BRIDGE=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KEYS=y
          CONFIG_SECURITY=y
          CONFIG_SECCOMP=y
          CONFIG_MEMCG=y
          CONFIG_IPC_NS=y
          CONFIG_UTS_NS=y
          CONFIG_PID_NS=y
          CONFIG_NET_NS=y
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 导入S805固件配置
        run: |
          cd openwrt
          cat > .config <<-'EOF'
          CONFIG_TARGET_armvirt=y
          CONFIG_TARGET_armvirt_32=y
          CONFIG_TARGET_armvirt_32_Default=y
          CONFIG_ROOTSFS_PARTSIZE=1536
          CONFIG_PACKAGE_docker=y
          CONFIG_PACKAGE_luci-app-dockerman=y
          CONFIG_PACKAGE_containerd=y
          CONFIG_PACKAGE_dockerd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-theme-argon=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          EOF

          mkdir -p files/etc/config
          cat > files/etc/config/network <<-'EOF'
          config interface 'loopback'
                  option device 'lo'
                  option proto 'static'
                  option ipaddr '127.0.0.1'
          config interface 'lan'
                  option device 'br-lan'
                  option proto 'static'
                  option ipaddr '192.168.2.2'
                  option netmask '255.255.255.0'
                  option gateway '192.168.2.1'
                  option dns '223.5.5.5 114.114.114.114'
          config device
                  option name 'br-lan'
                  option type 'bridge'
                  list ports 'eth0'
          EOF

          cat > files/etc/config/luci <<-'EOF'
          config core 'main'
                  option lang 'zh_cn'
                  option mediaurlbase '/luci-static/argon'
          EOF

      - name: 生成编译配置
        run: |
          cd openwrt
          make defconfig

      - name: 开始编译固件
        run: |
          cd openwrt
          make -j1 V=s

      - name: 上传编译好的固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-s805-k${{ inputs.kernel }}-docker
          path: openwrt/bin/targets/armvirt/32/*.img.gz
