name: S805-最终版(Docker+Argon+TTYD+空间扩容)
on:
  workflow_dispatch:
    inputs:
      system:
        description: '选择系统'
        required: true
        default: 'immortalwrt'
        type: choice
        options:
          - openwrt
          - immortalwrt
      branch:
        description: '分支'
        required: true
        default: 'openwrt-23.05'
        type: choice
        options:
          - openwrt-23.05
          - openwrt-24.10

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: 安装依赖
      run: |
        sudo apt update -y
        sudo apt install -y build-essential libncurses-dev gawk git libssl-dev gettext xsltproc zlib1g-dev unzip python3 python3-pip

    - name: 下载源码
      run: |
        if [ "${{ inputs.system }}" = "immortalwrt" ]; then
          git clone --depth=1 -b ${{ inputs.branch }} https://github.com/immortalwrt/immortalwrt openwrt
        else
          git clone --depth=1 -b ${{ inputs.branch }} https://github.com/openwrt/openwrt openwrt
        fi

    - name: 安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 导入 S805 配置
      run: |
        cd openwrt
        cat > .config << EOF
CONFIG_TARGET_armvirt=y
CONFIG_TARGET_armvirt_32=y
CONFIG_TARGET_armvirt_32_Default=y
CONFIG_ROOTSFS_PARTSIZE=1536
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
CONFIG_PACKAGE_docker=y
CONFIG_PACKAGE_luci-app-dockerman=y
CONFIG_PACKAGE_block-mount=y
CONFIG_PACKAGE_e2fsprogs=y
EOF

    - name: 下载依赖
      run: |
        cd openwrt
        make defconfig

    - name: 编译固件
      run: |
        cd openwrt
        make -j$(nproc)

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-s805
        path: openwrt/bin/targets/armvirt/32/*.img.gz
