name: S805-OpenWrt&Immortalwrt(带Docker+Argon+空间扩容)
on:
  workflow_dispatch:
    inputs:
      SOURCE_TYPE:
        description: '选择系统'
        required: true
        default: 'Immortalwrt'
        type: choice
        options:
          - OpenWrt
          - Immortalwrt
      REPO_BRANCH:
        description: '分支'
        required: true
        default: 'openwrt-23.05'
        type: choice
        options:
          - openwrt-23.05
          - openwrt-24.10
      CONFIG_FILE:
        description: '配置文件'
        required: true
        default: 's805'

env:
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name:  checkout
      uses: actions/checkout@v4

    - name: 设置源码
      run: |
        if [ "${{ inputs.SOURCE_TYPE }}" = "OpenWrt" ]; then
          echo "REPO_URL=https://github.com/openwrt/openwrt" >> $GITHUB_ENV
        else
          echo "REPO_URL=https://github.com/immortalwrt/immortalwrt" >> $GITHUB_ENV
        fi

    - name: 运行编译
      uses: 281677160/common@main
